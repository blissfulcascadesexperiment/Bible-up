<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 5 Bible Training</title>
  <style>
    :root {
      --bg: #faf7f0;
      --card: #fff;
      --ink: #2b2b2b;
      --accent: #7c5cff;
      --accent2: #34d1bf;
      --muted: #777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 4px; }
    header p { margin: 0; opacity: .9; }
    nav#topicNav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 16px;
    }
    nav#topicNav button {
      border: 2px solid var(--accent);
      background: #fff;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    nav#topicNav button.active {
      background: var(--accent);
      color: #fff;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin: 14px 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }
    .card h2 { margin: 0 0 6px; }
    .tag {
      display: inline-block;
      background: #efeaff;
      color: var(--accent);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .scripture-link {
      display: inline-block;
      margin-left: 10px;
      color: var(--accent);
      text-decoration: underline;
      font-weight: 700;
    }
    h3 {
      margin: 18px 0 8px;
      color: var(--accent);
    }
    ul { margin: 6px 0; padding-left: 22px; }
    li { margin: 5px 0; }
    .verse {
      background: #f4f1ff;
      border-left: 4px solid var(--accent);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 0 8px 8px 0;
    }
    .verse b { display: block; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>📖 Step 5 Bible Training</h1>
    <p>Study resource — 8 foundations</p>
  </header>

  <nav id="topicNav"></nav>

  <main>
    <section id="topicCards"></section>
  </main>

  <script>
    const TOPICS = [
      {
        id: 'study',
        icon: '📖',
        title: 'How to Study Your Bible',
        overview: 'The Bible feeds us when we read it slowly, in context, and with obedience. Study turns information into transformation.',
        verses: [
          { ref: '2 Timothy 2:15', text: 'Study to show yourself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth.' },
          { ref: 'Psalm 119:105', text: 'Thy word is a lamp unto my feet, and a light unto my path.' },
          { ref: 'Joshua 1:8', text: 'This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night.' }
        ],
        points: [
          'Observe → Interpret → Apply: what does it say, mean, and change?',
          'Always read in context — verse, chapter, and whole Bible story.',
          'Compare Scripture with Scripture; let clear passages explain difficult ones.'
        ],
        reflect: [
          'What passage will you study slowly this week?',
          'What keeps you from daily reading, and what will you change?',
          'Who can you share one insight with?'
        ]
      },
      {
        id: 'prayer',
        icon: '🙏',
        title: 'Prayer Life',
        overview: 'Prayer is ongoing conversation with God — talking and listening.',
        verses: [
          { ref: '1 Thessalonians 5:17', text: 'Pray without ceasing.' },
          { ref: 'Philippians 4:6', text: 'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.' }
        ],
        points: ['Pray daily, consistently, and with expectation.', 'Use prayer as communication, not just requests.'],
        reflect: ['What will you pray for today?', 'When is your quiet time?']
      }
    ];

    const nav = document.getElementById('topicNav');
    const cards = document.getElementById('topicCards');
    let activeTopic = 'study';

    TOPICS.forEach(topic => {
      const button = document.createElement('button');
      button.textContent = topic.icon + ' ' + topic.title;
      button.className = topic.id === activeTopic ? 'active' : '';
      button.addEventListener('click', () => {
        activeTopic = topic.id;
        render();
      });
      nav.appendChild(button);
    });

    function render() {
      [...nav.children].forEach((button, index) => {
        const topicId = TOPICS[index].id;
        button.classList.toggle('active', topicId === activeTopic);
      });

      const topic = TOPICS.find(item => item.id === activeTopic);
      const scriptureLink = topic.id === 'study'
        ? '<a href="scripture-quiz.html" class="scripture-link">scripture quiz</a>'
        : '';

      cards.innerHTML = `
        <div class="card">
          <span class="tag">${topic.icon} FOUNDATION</span>${scriptureLink}
          <h2>${topic.title}</h2>
          <p>${topic.overview}</p>

          <h3>🔑 Key Verses</h3>
          ${topic.verses.map(v => `
            <div class="verse">
              <b>${v.ref}</b>
              ${v.text}
            </div>
          `).join('')}

          <h3>📌 Study Outline</h3>
          <ul>${topic.points.map(p => `<li>${p}</li>`).join('')}</ul>

          <h3>💭 Reflection Questions</h3>
          <ul>${topic.reflect.map(q => `<li>${q}</li>`).join('')}</ul>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
